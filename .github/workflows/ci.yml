name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  browser:
    # The browser suites are the real acceptance tests: smoke plus one demo per game family, in headless Chrome with
    # software WebGL2 (SwiftShader). They run one at a time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ensure a Chrome for Playwright
        run: |
          if [ ! -x /usr/bin/google-chrome ]; then npx playwright install --with-deps chromium; fi
      - run: npm run build
      - run: npm run test:browser
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: .smoke/
          if-no-files-found: ignore
          retention-days: 14
