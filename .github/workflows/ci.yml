name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: SDK API reference (TypeDoc)
        run: npm run docs:api

  browser:
    # The browser suites are the real acceptance tests: smoke plus one demo per game family, in headless Chrome with
    # software WebGL2 (SwiftShader). They run one at a time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ensure a Chrome for Playwright
        run: |
          if [ ! -x /usr/bin/google-chrome ]; then npx playwright install --with-deps chromium; fi
      - run: npm run build
      - run: npm run test:browser -- --retries 1
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: .smoke/
          if-no-files-found: ignore
          retention-days: 14

  perf:
    # Optional (P2.7): frame-time budgets from scripts/perf-budget.json. Runs on manual dispatch or for PRs labelled
    # "perf". GitHub's hosted runners have no GPU, so this guards CPU-side regressions on SwiftShader; point it at a
    # GPU runner (runs-on) for real GPU numbers.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ensure a Chrome for Playwright
        run: |
          if [ ! -x /usr/bin/google-chrome ]; then npx playwright install --with-deps chromium; fi
      - run: npm run build
      - run: npm run perf -- --enforce
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: .smoke/perf-report.json
          if-no-files-found: ignore
          retention-days: 30

  visual:
    # P3.3: golden screenshots per genre template and a few presets (Playwright toHaveScreenshot), in Chromium, Firefox
    # and WebKit. Non-blocking until the goldens are confirmed stable on hosted runners: Chromium compares against the
    # committed linux goldens; Firefox/WebKit write any missing goldens ("missing") and upload them so they can be
    # reviewed and committed. Download the "visual-*" artifact to inspect diffs (report + actual/expected/diff PNGs).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: |
          if [ "${{ matrix.project }}" = chromium ]; then
            if [ ! -x /usr/bin/google-chrome ]; then npx playwright install --with-deps chromium; fi
          else
            npx playwright install --with-deps ${{ matrix.project }}
            # Headless Firefox/WebKit on hosted runners have no WebGL2 without a display: use Xvfb + Mesa llvmpipe.
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1
          fi
      - name: Visual regression (${{ matrix.project }})
        run: |
          if [ "${{ matrix.project }}" = chromium ]; then
            npm run test:visual -- --project=chromium
          else
            # Bootstrap any missing goldens (Playwright marks a freshly written golden as failed), then compare for
            # real: a second render must match the first, which also catches non-deterministic frames.
            VISUAL_HEADED=1 xvfb-run -a npm run test:visual -- --project=${{ matrix.project }} --update-snapshots=missing || true
            VISUAL_HEADED=1 xvfb-run -a npm run test:visual -- --project=${{ matrix.project }}
          fi
      - name: Upload report, diffs and goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.project }}
          path: |
            .build/visual-report/
            .build/visual-results/
            tests/visual/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
